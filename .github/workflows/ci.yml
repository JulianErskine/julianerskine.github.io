name: CI

on:
  push:
    branches: [master]
  pull_request:
  repository_dispatch:
    types: [cv-released]

permissions:
  contents: read

jobs:
  # Runs on every push and PR. make build / make lint run in Docker
  # (node:20-alpine) via the Makefile — see Makefile for the actual commands.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build + lint site
        run: make lint

  # Runs after push to master, or when the CV repo's release workflow
  # fires a repository_dispatch (see julian-CV/.github/workflows/release.yml)
  # after publishing a new CV build. Requires repo Settings > Pages > Source
  # = "GitHub Actions" (one-time manual change; Eleventy isn't a generator
  # Pages builds itself).
  #
  # Upload and deploy are deliberately separate jobs: with both in one job,
  # deploy-pages' artifact lookup can race the just-finalized upload and
  # find 0 artifacts (actions/deploy-pages#451), and re-running that job
  # uploads a second "github-pages" artifact. Split, a deploy failure can be
  # retried with "Re-run failed jobs" against the one existing artifact.
  build:
    if: github.ref == 'refs/heads/master' || github.event_name == 'repository_dispatch'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - name: Fetch latest CV PDFs
        # julian-CV is a private repo, so this needs auth even for release
        # assets. CV_REPO_TOKEN is a PAT with read access to it (repo scope),
        # stored as a secret on this repo — not the same token julian-CV
        # uses to dispatch *to* this repo.
        env:
          GH_TOKEN: ${{ secrets.CV_REPO_TOKEN }}
        run: |
          mkdir -p src/cv
          # Pin the tag once so the metadata and the PDFs come from the same
          # release. cvRelease.json feeds the "last updated" date on /cv/.
          tag=$(gh release view --repo JulianErskine/julian-CV --json tagName -q .tagName)
          gh release view "$tag" --repo JulianErskine/julian-CV \
            --json tagName,publishedAt > src/_data/cvRelease.json
          gh release download "$tag" --repo JulianErskine/julian-CV \
            --pattern 'erskine-cv-en-public.pdf' \
            --pattern 'erskine-cv-fr-public.pdf' \
            --dir src/cv --clobber
          mv src/cv/erskine-cv-en-public.pdf src/cv/public_cv-en.pdf
          mv src/cv/erskine-cv-fr-public.pdf src/cv/public_cv-fr.pdf
      - name: Build site
        run: make build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
